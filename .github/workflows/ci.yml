name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Create the configured pytest base temporary directory
        # pyproject.toml pins --basetemp=.pytest_cache/tmp, which pytest does not
        # create on a pristine checkout. Without this, every tmp_path fixture
        # errors during setup on the first run.
        run: mkdir -p .pytest_cache/tmp

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run the test suite
        run: python -m pytest -q
